name: Mirror Little Snitch releases

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Publish, verify downloads, discover, or refresh the version index
        type: choice
        options: [publish, verify, discover, index]
        default: publish

permissions:
  contents: read

concurrency:
  group: littlesnitch-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'LOVECHEN/littlesnitch-release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test discovery and integrity checks
        run: python3 -B -m unittest discover -s tests -v
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.mode != 'discover' && inputs.mode != 'index'
        with:
          cosign-release: v3.1.4
      - name: Mirror official downloads
        if: inputs.mode != 'index'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'publish' }}
        run: python3 -B scripts/mirror.py "$MODE"
      - name: Refresh the README version index
        if: inputs.mode == 'index' || (inputs.mode || 'publish') == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m scripts.release_index
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs(releases): refresh version index'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/main
